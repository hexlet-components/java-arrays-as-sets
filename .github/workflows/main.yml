name: JavaCI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up OpenJDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '25'
          cache: 'gradle'
          distribution: 'temurin'
      - run: make build
      - run: make lint
      - run: make test
