version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies", "automated"]
    groups:
      github-actions-all:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies", "automated"]
    groups:
      gradle-all:
        patterns: ["*"]
